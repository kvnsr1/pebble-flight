<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pebble Flight Settings</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { margin: 0; background: #eef2f6; color: #152238; }
    main { max-width: 440px; margin: auto; padding: 24px 18px; }
    h1 { margin: 0 0 8px; }
    p { color: #526174; line-height: 1.4; }
    fieldset { margin: 16px 0; padding: 4px 14px 16px; border: 1px solid #c4cfdb; border-radius: 12px; background: rgba(255,255,255,.65); }
    legend { padding: 0 7px; color: #263f58; font-size: 15px; font-weight: 800; }
    label { display: block; margin: 12px 0 6px; font-weight: 700; }
    input { box-sizing: border-box; width: 100%; padding: 13px; border: 1px solid #aab5c2; border-radius: 9px; font-size: 17px; background: white; color: #152238; }
    input:focus { outline: 3px solid rgba(8, 104, 172, .22); border-color: #0868ac; }
    button { width: 100%; margin-top: 24px; padding: 14px; border: 0; border-radius: 9px; background: #0868ac; color: white; font-size: 18px; font-weight: 700; }
    small { display: block; margin-top: 8px; color: #68778a; line-height: 1.35; }
    .notice { padding: 12px; border-radius: 9px; background: #dceaf5; color: #263f58; font-size: 14px; }
  </style>
</head>
<body>
<main>
  <h1>Pebble Flight</h1>
  <p>Add up to three flights. Long-press Select on the watch to move between them.</p>
  <form id="settings">
    <div id="flights"></div>
    <label for="apiKey">FlightAware AeroAPI key</label>
    <input id="apiKey" type="password" autocomplete="off" placeholder="Paste your AeroAPI key">
    <small id="keyHelp">Your key is sent only to the Pebble app on this phone and is never placed in this page's URL.</small>
    <p class="notice">Only the flight visible on the watch refreshes automatically, keeping AeroAPI usage low.</p>
    <button type="submit">Save flights</button>
  </form>
</main>
<script>
  var params = new URLSearchParams(location.search);
  var flights = document.getElementById('flights');
  var today = new Date();
  var localToday = new Date(today.getTime() - today.getTimezoneOffset() * 60000)
    .toISOString().slice(0, 10);

  for (var i = 1; i <= 3; i += 1) {
    var fieldset = document.createElement('fieldset');
    var number = params.get('f' + i) || (i === 1 ? params.get('flightNumber') : '') || '';
    var date = params.get('d' + i) || (i === 1 ? params.get('flightDate') : '') || '';
    fieldset.innerHTML =
      '<legend>Flight ' + i + (i === 1 ? '' : ' · optional') + '</legend>' +
      '<label for="flightNumber' + i + '">Flight number</label>' +
      '<input id="flightNumber' + i + '" placeholder="' + (i === 1 ? 'AA100' : 'Optional') + '" ' +
        'autocapitalize="characters" autocomplete="off" spellcheck="false" maxlength="12" pattern="[A-Za-z0-9]{2,12}">' +
      '<label for="flightDate' + i + '">Departure date</label>' +
      '<input id="flightDate' + i + '" type="date">';
    flights.appendChild(fieldset);
    document.getElementById('flightNumber' + i).value = number;
    document.getElementById('flightDate' + i).value = date || (i === 1 ? localToday : '');
  }

  document.getElementById('flightNumber1').required = true;
  document.getElementById('flightDate1').required = true;

  if (params.get('hasApiKey') === '1') {
    document.getElementById('apiKey').placeholder = 'Leave blank to keep saved key';
    document.getElementById('keyHelp').textContent =
      'A key is already saved on this phone. Leave this blank to keep it, or enter a replacement.';
  }

  document.getElementById('settings').addEventListener('submit', function(event) {
    event.preventDefault();
    var resultFlights = [];
    for (var i = 1; i <= 3; i += 1) {
      var numberInput = document.getElementById('flightNumber' + i);
      var dateInput = document.getElementById('flightDate' + i);
      numberInput.setCustomValidity('');
      dateInput.setCustomValidity('');
      var number = numberInput.value.trim().toUpperCase();
      var date = dateInput.value;
      if (number && !date) {
        dateInput.setCustomValidity('Choose a departure date for this flight.');
        dateInput.reportValidity();
        return;
      }
      if (!number && date) {
        numberInput.setCustomValidity('Enter a flight number or clear the date.');
        numberInput.reportValidity();
        return;
      }
      if (number) { resultFlights.push({flightNumber: number, flightDate: date}); }
    }
    var result = {
      flights: resultFlights,
      apiKey: document.getElementById('apiKey').value.trim()
    };
    location.href = 'pebblejs://close#' + encodeURIComponent(JSON.stringify(result));
  });
</script>
</body>
</html>
