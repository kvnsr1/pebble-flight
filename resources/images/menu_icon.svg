<svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 25 25">
  <rect width="25" height="25" rx="5" fill="#f7fbff"/>

  <!-- Pixel-art passenger jet climbing away from the runway. -->
  <g fill="#f7fbff" stroke="#071b2b" stroke-width="1.35" stroke-linejoin="miter" shape-rendering="crispEdges">
    <path d="M3 14h4l3-2 3-2 3-2 4-2h2l1 1v2l-3 2-3 2-4 2-4 1H5l-2-1Z"/>
    <path d="m7 13-3-4h2l5 3-2 2Z"/>
    <path d="m13 11-2-5h2l4 3-2 3Z"/>
    <path d="m14 14-1 5h-2l-1-4Z"/>
  </g>
  <g fill="#42d7ff" shape-rendering="crispEdges">
    <rect x="16" y="9" width="1" height="1"/>
    <rect x="18" y="8" width="1" height="1"/>
    <rect x="20" y="7" width="1" height="1"/>
    <rect x="3" y="17" width="4" height="1"/>
    <rect x="5" y="19" width="4" height="1"/>
  </g>

  <!-- Small control tower and runway echo the reference image. -->
  <g fill="#071b2b" shape-rendering="crispEdges">
    <rect x="19" y="15" width="2" height="6"/>
    <rect x="17" y="14" width="6" height="3"/>
    <rect x="18" y="13" width="4" height="1"/>
