  </g>
  <g fill="#f7fbff" shape-rendering="crispEdges">
    <rect x="18" y="15" width="1" height="1"/>
    <rect x="20" y="15" width="1" height="1"/>
    <rect x="22" y="15" width="1" height="1"/>
    <rect x="4" y="21" width="4" height="1"/>
    <rect x="11" y="21" width="4" height="1"/>
  </g>
  <rect x="18" y="22" width="4" height="1" fill="#ffd45c" shape-rendering="crispEdges"/>
</svg>
